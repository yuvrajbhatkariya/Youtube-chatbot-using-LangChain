<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>YouTube ChatBot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>YouTube Chat</h1>

    <div id="video-status" class="status">Checking current tab...</div>

    <textarea id="question" placeholder="Ask something about this video..." rows="3"></textarea>
    <button id="ask">Ask</button>

    <div id="answer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
